<p>chat-history works!</p>

<mat-card *ngFor="let message of chatHistory?.messages" [className]="chooseStyleFromSender(message.sender)">
  <mat-card-header>
    <div mat-card-avatar class="avatar-image"></div>
    <mat-card-title>{{message.sender.username}}</mat-card-title>
    <mat-card-subtitle>{{message.sentAt | date:'fullDate'}}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <p>{{message.message}}</p>
  </mat-card-content>
  <!--<mat-card-actions>
    <button mat-button>LIKE</button>
    <button mat-button>SHARE</button>
  </mat-card-actions>-->
</mat-card>
