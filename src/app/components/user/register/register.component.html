<form [formGroup]="registerForm" passwordPatternValidator passwordEqualityValidator>
    <mat-grid-list cols="1" rowHeight="60px">
        <mat-grid-tile>
            <h2>Register</h2>
        </mat-grid-tile>
        <mat-grid-tile>
            <mat-form-field class="example-full-width" appearance="fill">
                <mat-label>Login</mat-label>
                <input matInput type='text' formControlName='login' required autocomplete="off">
            </mat-form-field>
        </mat-grid-tile>

        <mat-grid-tile>
            <mat-form-field class="example-full-width" appearance="fill">
                <mat-label>Password</mat-label>
                <input matInput type="password" formControlName="pass" min="0" required autocomplete="off"
                    matTooltip="The password should contain of between 8 and 30 characters, numerals and if you want special characters.">
            </mat-form-field>
            <mat-error *ngIf="registerForm.get('pass')?.hasError('passPattern')">{{errors.passPattern}} </mat-error>
        </mat-grid-tile>

        <mat-grid-tile>
            <mat-form-field class="example-full-width" appearance="fill">
                <mat-label>Repeat passwort</mat-label>
                <input matInput type="password" formControlName="passRepeat" min="0" required autocomplete="off">
            </mat-form-field>
            <mat-error *ngIf="registerForm.get('passRepeat')?.hasError('passwordNotEqual')">{{errors.passwordNotEqual}} </mat-error>
        </mat-grid-tile>

        <mat-grid-tile>
            <mat-form-field class="example-full-width" appearance="fill">
                <mat-label>eMail</mat-label>
                <input matInput type='email' formControlName='email' required autocomplete="off">
            </mat-form-field>
        </mat-grid-tile>

        <mat-grid-tile>
            <button mat-raised-button color="secondary" type="submit" (click)="submitRegister()">Submit</button>
            <button mat-raised-button color="secondary" (click)="clear()">Clear</button>
        </mat-grid-tile>
    </mat-grid-list>
</form>
