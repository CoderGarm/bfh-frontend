<div id="home-center" *ngIf="!latestContent">
    <p>Battle for Honor</p>
    <p>The browser game</p>
</div>
<app-display-article [latestContent]="latestContent"></app-display-article>

<div class="flex-items-container">
    <button class="tour-btn" mat-flat-button color="primary" routerLink='/{{route.path}}'>
        <mat-icon>search</mat-icon>
        <span>{{ 'burger-menu.' + route.path | translate }}</span>
    </button>
</div>

<div class="footer">
    <hr>
    <span>Contact: webmaster [at] battleforhonor.de</span>

    <button mat-mini-fab color="primary" id="credits-btn" matTooltip="Credits to contributors"
            (click)="isOpen = !isOpen"
            cdkOverlayOrigin #trigger="cdkOverlayOrigin">
        <mat-icon>help_outline</mat-icon>
    </button>

    <ng-template
            cdkConnectedOverlay
            [cdkConnectedOverlayOrigin]="trigger"
            [cdkConnectedOverlayOpen]="isOpen">
        <app-contribute-credits></app-contribute-credits>
    </ng-template>

    <hr>
</div>
