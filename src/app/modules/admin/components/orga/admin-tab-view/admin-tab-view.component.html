<mat-tab-group animationDuration="500ms" *ngIf="isAdmin">
    <mat-tab label="{{ 'tab.admin.do-tick' | translate }}">
        <ng-template matTabContent>
            <mat-toolbar color="secondary" class="stat-tool-bar">
                <mat-toolbar-row>
                    <span>Game Admin Area - don't fuck around!</span>
                </mat-toolbar-row>
                <mat-toolbar-row>
                    <button mat-flat-button color="primary" (click)='doTick()' *ngIf='isLoggedIn && isAdmin' [disabled]="!isLocalhost">
                        Do tick
                    </button>
                </mat-toolbar-row>
            </mat-toolbar>
        </ng-template>
    </mat-tab>
    <mat-tab label="{{ 'tab.admin.translations' | translate }}">
        <ng-template matTabContent>
            <app-translation></app-translation>
        </ng-template>
    </mat-tab>
    <mat-tab label="{{ 'tab.admin.statistics' | translate }}">
        <ng-template matTabContent>
            <app-statistics></app-statistics>
        </ng-template>
    </mat-tab>
</mat-tab-group>
