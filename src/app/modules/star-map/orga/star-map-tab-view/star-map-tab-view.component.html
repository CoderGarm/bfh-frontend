<mat-tab-group #tabGroup [(selectedIndex)]="index" (selectedIndexChange)="indexChanged($event)">
    <mat-tab [label]="actionTabTitles[0]">
        <app-universe-map-view (starSystemSelectionOutput)="run($event)"></app-universe-map-view>
    </mat-tab>
    <mat-tab [label]="actionTabTitles[1]">
        <app-star-map-view [starSystemSelectionInput]="starSystemSelectionInput"></app-star-map-view>
    </mat-tab>
</mat-tab-group>
