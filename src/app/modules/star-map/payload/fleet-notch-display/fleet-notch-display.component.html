<mat-card *ngIf="!!fleet">
    <mat-card-header>
        <img mat-card-avatar class="avatar-image icon" src="{{getLink()}}" alt="fleet-icon" [ngClass]="getCssMarker()">
        <mat-card-title>
            {{fleet.name}}
        </mat-card-title>
        <mat-card-subtitle>
            <div mat-subheader *ngIf="!!destinationRepresentation">{{destinationRepresentation}}</div>
            <div mat-subheader *ngIf="!!orbitRepresentation">{{orbitRepresentation}}</div>
        </mat-card-subtitle>
        <app-spacecraft-state-block-display *ngIf="isOwnFleet()"
                                            [stateBlock]="fleet.state"
                                            [isFleet]="true"></app-spacecraft-state-block-display>
    </mat-card-header>
</mat-card>
