<mat-card style="background-color: transparent;">
    <mat-card-title>Manual transfer</mat-card-title>
    <mat-card-content>
        <div *ngFor="let fleet of commService.selectedFleets">
            <app-fleet-display transparent [fleet]="fleet" *ngIf="isOwnFleet(fleet)">
                <app-manual-transport transparent body [fleet]="fleet" [floatingStyle]="false"></app-manual-transport>
            </app-fleet-display>
        </div>
    </mat-card-content>
</mat-card>
