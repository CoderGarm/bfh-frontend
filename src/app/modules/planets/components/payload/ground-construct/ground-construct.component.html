<app-resource-service [deposit]="resourceDeposit"
                      [costs]="costsToDisplay"
                      [income]="income"
                      [capacity]="capacity"
                      [levelImprovementResources]="levelImprovementResources"
                      [levelImprovementHumanResources]="levelImprovementHumanResources"></app-resource-service>

<div>
    <!--<mat-form-field appearance="outline" class="filter" (click)="toggle('productCategoryChipList')"> todo add toggle functionality -->
    <mat-label>Product category</mat-label>
    <mat-chip-listbox #productCategoryChipList multiple [formControl]="eProductionCategoryFC">
        <mat-chip-option
                class="no-checkmark"
                *ngFor="let category of eProductionCategories as string"
                [value]="category"
                (selectionChange)="filterDisplayedConstructions()">
            <mat-icon matChipTrailingIcon aria-hidden="false" [attr.aria-label]="category" fontIcon="precision_manufacturing"></mat-icon>
            {{category}}
        </mat-chip-option>
    </mat-chip-listbox>

    <!--<mat-form-field appearance="outline" class="filter" (click)="toggle('refinementSequenceChipList')">-->
    <mat-label>Refinement sequence</mat-label>
    <mat-chip-listbox #refinementSequenceChipList multiple [formControl]="eRefinementSequenceFC">
        <mat-chip-option
                class="no-checkmark"
                *ngFor="let sequence of eRefinementSequences"
                [value]="sequence.typeName"
                (selectionChange)="filterDisplayedConstructions()">
            <mat-icon matChipTrailingIcon aria-hidden="false" [attr.aria-label]="sequence.typeName" fontIcon="precision_manufacturing"></mat-icon>
            {{sequence.typeName}}
        </mat-chip-option>
    </mat-chip-listbox>

    <!--<mat-form-field appearance="outline" class="filter" (click)="toggle('resourceTypeChipList')">-->
    <mat-label>Resource types</mat-label>
    <mat-chip-listbox #resourceTypeChipList multiple [formControl]="eResourceTypeFC">
        <mat-chip-option
                class="no-checkmark"
                *ngFor="let eResourceType of eResourceTypes"
                [value]="eResourceType.typeName"
                (selectionChange)="filterDisplayedConstructions()">
            <mat-icon matChipTrailingIcon aria-hidden="false" [attr.aria-label]="eResourceType.typeName" fontIcon="precision_manufacturing"></mat-icon>
            {{eResourceType.typeName}}
        </mat-chip-option>
    </mat-chip-listbox>
</div>


{{ 'planetary.constructions.title' | translate }}
<mat-accordion>
    <mat-expansion-panel *ngFor="let construction of filteredConstructions"
                         (opened)="setOpened(construction)"
                         (closed)="setClosed(construction)"
                         (mouseover)="showCosts(construction)"
                         (mouseout)="showCosts(null)">
        <mat-expansion-panel-header>
            <mat-panel-title>
                <img mat-card-avatar class="avatar-image icon"
                     src="{{getLink(construction)}}"
                     [ngClass]="getInvisibility(construction)"
                     alt="construction">
                {{getTitle(construction)}}
            </mat-panel-title>
            <mat-panel-description *ngIf="showDescription(construction)">
                {{construction.building.description}}
            </mat-panel-description>
        </mat-expansion-panel-header>
        <app-construction-display
                [construction]="construction"
                [resourceDeposit]="resourceDeposit"
                [costsToDisplay]="costsToDisplay"
                [constructionPossible]="constructionPossible"
                (constructionOutput)="startConstruction($event)"></app-construction-display>
    </mat-expansion-panel>
</mat-accordion>
