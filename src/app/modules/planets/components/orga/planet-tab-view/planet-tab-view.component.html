<mat-tab-group animationDuration="0ms" class="bottom-spacer">
    <mat-tab label="{{'tab.planetary.dashboard' | translate}}">
        <app-planetary-dashboard [planet]="selectedPlanet"></app-planetary-dashboard>
    </mat-tab>
    <mat-tab label="{{'tab.planetary.ground-constructions' | translate}}">
        <app-ground-construct [selectedPlanetInput]="selectedPlanet"></app-ground-construct>
    </mat-tab>
    <mat-tab label="{{'tab.planetary.shipyard' | translate}}" [disabled]="!shipyardJobPossible">
        <app-shipyard [selectedPlanetInput]="selectedPlanet"></app-shipyard>
    </mat-tab>
    <mat-tab label="{{'tab.planetary.jobs' | translate}}">
        <app-jobs-list [selectedPlanetInput]="selectedPlanet"></app-jobs-list>
    </mat-tab>
</mat-tab-group>
