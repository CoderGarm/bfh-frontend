<mat-sidenav-container class="drawer-container">
    <mat-sidenav mode="side" class="drawer-list" [opened]="sideNavOpen">
        <app-planet-selection (selectedPlanetOutput)="selectedPlanetInput = $event"></app-planet-selection>
    </mat-sidenav>
    <mat-sidenav-content>
        <div class="side-nav-open-change-area" (mouseenter)="onSideNavToggle()" (mouseout)="onSideNavToggle()"></div>
        <app-planet-tab-view [selectedPlanetInput]="selectedPlanetInput"></app-planet-tab-view>
    </mat-sidenav-content>
</mat-sidenav-container>
