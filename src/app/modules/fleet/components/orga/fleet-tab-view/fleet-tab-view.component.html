<mat-tab-group animationDuration="0ms" class="bottom-spacer">
    <mat-tab label="{{'tab.fleet.dashboard' | translate}}">
        <div class="holder">
            <app-fleet-display [fleetInput]="selectedFleetInput">
                <app-spacecraft-capabilities-display [baseFleetCapabilities]="selectedFleetInput?.fleetCapabilities"></app-spacecraft-capabilities-display>
                <app-fleet-move-display [fleetInput]="selectedFleetInput"></app-fleet-move-display>
            </app-fleet-display>
        </div>
    </mat-tab>
    <mat-tab label="{{'tab.fleet.movements' | translate}}">
        <div class="holder">
            <app-fleet-move-display [fleetInput]="selectedFleetInput"></app-fleet-move-display>
        </div>
    </mat-tab>
</mat-tab-group>
