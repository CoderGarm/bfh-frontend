<mat-list>
    <div mat-subheader>{{ 'fleet.composition.title' | translate }}</div>
    <mat-list-item *ngFor="let entry of warShipsByType  | keyvalue">
        <img mat-list-avatar src="{{getLink(entry.key)}}">
        <div>
            <div mat-subheader class="left height-fit-content">{{entry.key}}</div>
            <div mat-subheader class="left height-fit-content">{{getDescription(entry.key)}}</div>
        </div>

        <mat-list class="inner-list">
            <div mat-subheader>{{ 'fleet.composition.warShip-names' | translate }}</div>
            <mat-list-item *ngFor="let warShip of entry.value" class="height-fit-content">
                <div mat-subheader class="item height-fit-content">{{warShip.name}} -
                    {{warShip.shipClass.name}}
                    {{ 'fleet.composition.class.title' | translate }}</div>
            </mat-list-item>
        </mat-list>
    </mat-list-item>
</mat-list>
