<span [ngClass]="{'circurlar-border': _circleBorder}" [ngStyle]="{'background-color':backgroundColor}">
    <img *ngIf="!!icon" class="icon" [ngClass]="{'centered': _circleBorder}" src="assets/{{icon.folder}}{{sizeComplement}}/{{icon.iconName}}_{{color}}.png"
         alt="{{altText}}"
         matTooltip="{{toolTip}}">
</span>
