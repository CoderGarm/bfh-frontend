<div *ngIf="ammo.length > 0">
    <div mat-subheader *ngIf="!noTitle">{{ 'fleet.modules.ammunition-roster.title' | translate }}</div>
    <mat-list>
        <mat-list-item *ngFor="let a of ammo">
            <div mat-line>
                {{a.missile.baseModule.technicalTypeName}}: {{a.amount}} / {{a.capacity}}
            </div>
        </mat-list-item>
    </mat-list>
</div>
