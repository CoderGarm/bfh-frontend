<mat-list>
    <div mat-subheader *ngIf="finishedMovements.length == 0">{{ 'fleet.finished-movement.nothing' | translate }}</div>
</mat-list>
<div *ngIf="finishedMovements.length > 0">
    <mat-list>
        <div mat-subheader>{{ 'fleet.finished-movement.title' | translate }}</div>
    </mat-list>
    <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="transportation-tree">
        <mat-nested-tree-node *matTreeNodeDef="let node;">
            <div class="mat-tree-node">
                <button mat-icon-button matTreeNodeToggle>
                    <mat-icon class="mat-icon-rtl-mirror">
                        {{treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
                    </mat-icon>
                </button>
                <mat-list>
                    <div mat-line>Destination: {{node.name}}</div>
                </mat-list>
            </div>
            <div [class.transportation-tree-invisible]="!treeControl.isExpanded(node)" role="group">
                <div *ngIf="node.children.length > 0">
                    <div mat-subheader *ngFor="let childNode of node.children">
                        <img class="icon" src="{{getLink()}}">
                        {{childNode.finishedMovement.fleetName}} from {{childNode.finishedMovement.fromPlanet}}, {{childNode.finishedMovement.fromSystem}}
                    </div>
                </div>
            </div>
        </mat-nested-tree-node>
    </mat-tree>
</div>
