<mat-list>
    <div mat-subheader *ngIf="finishedMovements.length == 0">{{ 'fleet.finished-movement.nothing' | translate }}</div>
</mat-list>
<div *ngIf="finishedMovements.length > 0">
    <mat-list>
        <div mat-subheader>{{ 'fleet.finished-movement.title' | translate }}</div>
    </mat-list>
    <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="tree streamline-background">
        <mat-nested-tree-node *matTreeNodeDef="let node;">
            <div class="mat-tree-node">
                <button mat-icon-button matTreeNodeToggle>
                    <mat-icon class="mat-icon-rtl-mirror">
                        {{treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
                    </mat-icon>
                </button>
                <mat-list>
                    <mat-list-item>{{node.name}}</mat-list-item>
                </mat-list>
            </div>
            <div [class.tree-invisible]="!treeControl.isExpanded(node)" role="group">
                <div *ngIf="node.children.length > 0">
                    <div mat-subheader *ngFor="let childNode of node.children">
                        <img class="icon" src="assets/icons/fleets/png64x/small_fleet_c.png" alt="fleet-icon">
                        <mat-icon class="foreign-fleet" *ngIf="childNode.finishedMovement.isForeignFleet">warning_amber</mat-icon>
                        {{childNode.finishedMovement.fleetName}} of {{childNode.finishedMovement.fleetOwnerName}}
                    </div>
                </div>
            </div>
        </mat-nested-tree-node>
    </mat-tree>
</div>
