<mat-card *ngIf="!!fleet"
          [appearance]="_transparent ? 'raised' : 'outlined'"
          [ngStyle]="{'background-color':( _transparent ? 'transparent' : '')}" class="blue-card">
    <mat-card-header class="rename-element">
        <app-icon matCardAvatar png32px [fleetSize]="fleet.ships.length"></app-icon>
        <mat-card-title class="title-block" *ngIf="_nameChangeAllowed">
            <form [formGroup]="formGroup" matTooltip="Double click to rename">
                <mat-form-field appearance="outline"
                                class="name-input rename-element"
                                (dblclick)="enable()">
                    <input matInput autocomplete="off"
                           class="name-input"
                           type='text'
                           formControlName='fleetName'
                           (dblclick)="enable()">
                    <mat-icon matSuffix (click)="save()" class="name-input disabled">save_alt</mat-icon>
                </mat-form-field>
            </form>
        </mat-card-title>
        <mat-card-title *ngIf="!_nameChangeAllowed">
            {{fleet.name}}
        </mat-card-title>
        <app-spacecraft-state-block-display [stateBlock]="fleet.state" [isFleet]="true" *ngIf="isOwnFleet(fleet)"></app-spacecraft-state-block-display>
    </mat-card-header>
    <mat-card-content class="flex-items-container">
        <ng-content select="[body]"></ng-content>
    </mat-card-content>
    <mat-card-actions>
        <ng-content select="[actions]"></ng-content>
    </mat-card-actions>
</mat-card>
