<mat-card *ngIf="!!fleetInput">
    <mat-card-header>
        <img mat-card-avatar class="avatar-image icon" src="{{getLink()}}" alt="construction">
        <mat-card-title>
            {{fleetInput.name}}
        </mat-card-title>
        <mat-card-subtitle>
            idFleet: {{fleetInput.idFleet}}
        </mat-card-subtitle>
        <app-spacecraft-state-block-display [stateBlock]="fleetInput.state" [isFleet]="true"></app-spacecraft-state-block-display>
    </mat-card-header>
    <mat-card-content class="flex-items-container">
        <app-fleet-formation-display [selectedFleetInput]="fleetInput"></app-fleet-formation-display>
        <br>
        <ng-content select="[body]"></ng-content>
    </mat-card-content>
    <mat-card-actions>
        <ng-content select="[actions]"></ng-content>
    </mat-card-actions>
</mat-card>
