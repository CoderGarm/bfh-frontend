<mat-card *ngIf="!!fleetInput">
    <mat-card-header>
        <img mat-card-avatar class="avatar-image icon" src="{{getLink()}}" alt="construction">
        <mat-card-title>
            {{fleetInput.name}}
        </mat-card-title>
        <mat-card-subtitle>
            idFleet: {{fleetInput.idFleet}}
        </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content class="flex-items-container">
        <mat-accordion>
            <mat-expansion-panel>
                <mat-expansion-panel-header>
                    <mat-panel-title>Fleet composition</mat-panel-title>
                </mat-expansion-panel-header>
                <app-fleet-formation-display [selectedFleetInput]="fleetInput"></app-fleet-formation-display>
            </mat-expansion-panel>
        </mat-accordion>
        <ng-content></ng-content>
    </mat-card-content>
</mat-card>
