<div [ngStyle]="{'background-color':( _transparent ? 'transparent' : '')}" *ngIf="!!left && !!right">
    <div class="clearfix">
        <div class="title-holder clearfix">
            <div class="the-left">
                <p>{{fleet?.name}}</p>
            </div>
            <div class="the-right">
                <p>{{planet?.name}}</p>
            </div>
            <div class="the-right">
                <mat-icon matListItemIcon class="margin-l-r" inline>keyboard_double_arrow_left</mat-icon>
                <mat-icon matListItemIcon class="margin-l-r" inline>keyboard_double_arrow_right</mat-icon>
            </div>
        </div>
        <div>
            <div>Fleet loading capacity</div>
            <mat-progress-bar
                    mode="determinate"
                    value="{{ (usedCapacity / initialFreeCargoCapacity) * 100 }}"
                    matTooltip="{{ usedCapacity | numberShort }} / {{ initialFreeCargoCapacity | numberShort }}"></mat-progress-bar>
        </div>

        <div class="flex-items-container payload" *ngIf="!!left && !!right">
            <div>
                <div *ngFor="let resource of resourceTypes">
                    <app-single-resource-transfer
                            [resourceType]="resource"
                            [limitLeft]="freeCapacity"
                            [leftDeposit]="left"
                            [rightDeposit]="right"
                            (amountChange)="setAmount($event, resource)">
                    </app-single-resource-transfer>
                </div>
                <div *ngFor="let resource of educationTypes">
                    <app-single-resource-transfer
                            [resourceType]="resource"
                            [limitLeft]="freeCapacity"
                            [leftDeposit]="left"
                            [rightDeposit]="right"
                            (amountChange)="setAmount($event, resource)">
                    </app-single-resource-transfer>
                </div>
            </div>
        </div>
    </div>
    <div class="tooltip-container">
        <mat-divider></mat-divider>
        <div matTooltip="{{ 'transport.manual.transfer-btn.tooltip' | translate }}" class="btn-container">
            <button mat-raised-button color="secondary"
                    (click)="transfer()"
                    [disabled]="!transferSelected()">{{ 'transport.manual.transfer-btn.title' | translate }}</button>
        </div>
    </div>
