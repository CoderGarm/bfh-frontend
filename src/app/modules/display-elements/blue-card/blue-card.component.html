<mat-card style="background-color: transparent;" class="blue-card">
    <!-- yeah, transparent background make it looks good -->
    <mat-card-header>
        <ng-content select="[header]"></ng-content>
    </mat-card-header>
    <mat-card-content>
        <ng-content select="[body]"></ng-content>
    </mat-card-content>
    <mat-card-actions>
        <ng-content select="[actions]"></ng-content>
    </mat-card-actions>
</mat-card>
