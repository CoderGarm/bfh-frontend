<mat-card style="background-color: transparent;"
          [ngClass]="{'right-blue-card': _rightBlueCard, 'blue-card': !_rightBlueCard}">
    <!-- yeah, transparent background make it looks good -->
    <mat-card-header>
        <ng-content select="[header]"></ng-content>
    </mat-card-header>
    <mat-card-content>
        <ng-content select="[body]"></ng-content>
    </mat-card-content>
    <mat-card-actions [align]=" _rightBlueCard ? 'start' : 'end'">
        <ng-content select="[actions]"></ng-content>
    </mat-card-actions>
</mat-card>
