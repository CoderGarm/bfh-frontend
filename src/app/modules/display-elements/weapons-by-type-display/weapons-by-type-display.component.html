<mat-chip-listbox class="mat-mdc-chip-set-stacked sized-chips" aria-label="Color selection">
    <mat-chip-option *ngFor="let type of weaponTypes"
                     selected disabled
                     class="no-checkmark"
                     aria-label="{{ 'enum.name.weaponType.' + type | translate }}" matBadge="{{getAmount(type)}}" matBadgePosition="above after">
        {{ 'enum.name.weaponType.' + type | translate }}
    </mat-chip-option>
</mat-chip-listbox>
