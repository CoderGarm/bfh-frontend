<mat-card *ngIf="!!module" style="background-color: transparent;" class="right-blue-card">
    <mat-card-header>
        <app-icon matCardAvatar png32px orbitalStructure></app-icon>
        <app-icon class="the-other-icon" [icon]="getIcon()" *ngIf="_showIcon" png32px></app-icon>
        <mat-card-title>
            {{ module.name }}
            <ng-content select="[amount]"></ng-content>
        </mat-card-title>
        <mat-card-subtitle *ngIf="!_smallDisplay" style="max-width: 350px;">{{ module.description }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>

        <mat-list [class.small-display]="_smallDisplay" *ngIf="!module.propertyDescriptor?.orbitalModuleDescriptor?.inhabitants">
            <mat-list-item>
                <span matListItemLine>System wide effect: + {{ module.effectValue }}</span>
            </mat-list-item>
        </mat-list>

        <app-properties-orbital-module smallDisplay [propertyDescriptor]="module.propertyDescriptor"></app-properties-orbital-module>

        <app-resource-display *ngIf="_resourceMode" [libraryMode]="_libraryMode" [showTick]="false" [costs]="module.costs"></app-resource-display>

    </mat-card-content>
    <mat-card-actions>
        <ng-content select="[actions]"></ng-content>
    </mat-card-actions>
</mat-card>
