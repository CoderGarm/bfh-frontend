<div mat-subheader *ngIf="commissionedOperationals.length == 0">{{ 'journal.commissioned-operationals.' + title_key + '.nothing' | translate }}</div>
<div mat-subheader *ngIf="commissionedOperationals.length > 0">{{ 'journal.commissioned-operationals.' + title_key + '.title' | translate }}</div>

<div *ngIf="commissionedOperationals.length > 0">
    <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="tree streamline-background">
        <mat-nested-tree-node *matTreeNodeDef="let node;">
            <div class="mat-tree-node">
                <button mat-icon-button matTreeNodeToggle>
                    <mat-icon class="mat-icon-rtl-mirror">
                        {{treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
                    </mat-icon>
                </button>
                <div mat-subheader>At {{node.parent.planet}} in {{node.parent.system}}</div>
            </div>
            <div [class.tree-invisible]="!treeControl.isExpanded(node)" role="group" class="flex-items-container">
                <div *ngIf="!!node.parent.warships.length">
                    <div *ngFor="let entry of node.parent.warships">
                        <app-outlined titleValue="{{ 'journal.commissioned-operationals.title.warships' | translate }}: {{ entry.fleet }}">
                            <app-icon [fleetSize]="entry.warships.length"
                                      circleBorder
                                      png24px [toolTip]="entry.fleet"></app-icon>
                            <div class="flex-items-container">
                                <mat-list role="list">
                                    <mat-list-item *ngFor="let warship of entry.warships" style="font-size: small; height: fit-content;" role="listitem">
                                        {{ warship.name }}
                                        <app-icon matListItemAvatar
                                                  [icon]="warship.shipClass.shipClassType"
                                                  [altText]="warship.shipClass.shipClassType.typeName"
                                                  [toolTip]="warship.shipClass.shipClassType.typeName"></app-icon>
                                    </mat-list-item>
                                </mat-list>
                            </div>
                        </app-outlined>
                    </div>
                </div>
                <div *ngIf="node.parent.constructions.length > 0">

                    <app-outlined titleValue="{{ 'journal.commissioned-operationals.title.constructions' | translate }}">
                        <mat-list role="list">
                            <mat-list-item *ngFor="let c of node.parent.constructions" style="font-size: small; height: fit-content; margin: 5px;" role="listitem">
                                <app-icon [icon]="c.building.productionTarget"
                                          matListItemAvatar
                                          circleBorder
                                          png24px [toolTip]="c.building.name"></app-icon>
                                level {{ c.operationalLevel }} to {{ c.level }}
                            </mat-list-item>
                        </mat-list>
                    </app-outlined>
                </div>
                <div *ngIf="node.parent.orbitalModules.length > 0">

                    <app-outlined titleValue="{{ 'journal.commissioned-operationals.title.constructions' | translate }}">
                        <mat-list role="list">
                            <mat-list-item *ngFor="let c of node.parent.orbitalModules" style="font-size: small; height: fit-content; margin: 5px;" role="listitem">
                                <app-icon orbitalStructure matListItemAvatar circleBorder png24px [toolTip]="c.name"></app-icon>
                                {{ c.name }}
                            </mat-list-item>
                        </mat-list>
                    </app-outlined>
                </div>
            </div>
        </mat-nested-tree-node>
    </mat-tree>
</div>
