<mat-accordion *ngIf="!!weapon">
    <mat-expansion-panel class="margin-bottom">
        <mat-expansion-panel-header>
            <mat-panel-title>
                {{weapon.baseModule.name}}
                <mat-icon *ngIf="!!ammunitionModule"
                          matTooltip="{{ 'shipyard.fitting.ammunition.remember' | translate }}">report
                </mat-icon>
            </mat-panel-title>
            <mat-panel-description>
                {{weapon.baseModule.description}}
            </mat-panel-description>
        </mat-expansion-panel-header>
        <div class="flex-items-container">
            <app-numeric-counter [disabled]="supportsAlignment('STERN')" [startAt]="getAmountByAlignment('STERN')"
                                 caption='Stern'
                                 [min]="min" [max]="max" (amount)="setAmount('STERN', $event)"></app-numeric-counter>
            <app-numeric-counter [disabled]="supportsAlignment('BROADSIDE')" [startAt]="getAmountByAlignment('BROADSIDE')"
                                 caption='Broadside'
                                 [min]="min" [max]="max" (amount)="setAmount('BROADSIDE', $event)"></app-numeric-counter>
            <app-numeric-counter [disabled]="supportsAlignment('BOW')" [startAt]="getAmountByAlignment('BOW')"
                                 caption='Bow'
                                 [min]="min" [max]="max" (amount)="setAmount('BOW', $event)"></app-numeric-counter>
        </div>
        <div class="flex-items-container" *ngIf="!!weapon">
            <mat-form-field appearance="fill" class="short-field">
                <mat-label>Effect value</mat-label>
                <input matInput disabled value="{{weapon.baseModule.effectValue}}">
            </mat-form-field>

            <mat-form-field appearance="fill" class="short-field">
                <mat-label>Tech Level</mat-label>
                <input matInput disabled value="{{weapon.baseModule.techLevel}}">
            </mat-form-field>

            <mat-form-field appearance="fill" class="short-field">
                <mat-label>Capacity usage</mat-label>
                <input matInput disabled value="{{weapon.baseModule.useCapacity}}">
            </mat-form-field>
            <mat-form-field appearance="fill" class="short-field">
                <mat-label>Weapon type</mat-label>
                <input matInput disabled value="{{weapon.weaponType}}">
            </mat-form-field>

            <mat-form-field appearance="fill" class="short-field">
                <mat-label>Effective range</mat-label>
                <input matInput disabled value="{{getRange(weapon.ammunitionModule.missile)}}">
            </mat-form-field>

            <mat-form-field appearance="fill" class="short-field">
                <mat-label>Effective damage</mat-label>
                <input matInput disabled value="{{weapon.baseModule.effectValue}}">
            </mat-form-field>

            <mat-form-field appearance="fill" class="short-field">
                <mat-label>Weapon type</mat-label>
                <input matInput disabled value="{{weapon.weaponType}}">
            </mat-form-field>

            <mat-form-field appearance="fill">
                <mat-label>Alignments</mat-label>
                <input matInput disabled value="{{weapon.alignmentTypes}}">
            </mat-form-field>
        </div>
        <app-ammunition-module-counter *ngIf="!!ammunitionModule"
                                       [moduleInput]="ammunitionModule"
                                       [startAt]="getAmmoAmount()"
                                       (amount)="setAmmoAmount($event)"></app-ammunition-module-counter>
    </mat-expansion-panel>
</mat-accordion>
