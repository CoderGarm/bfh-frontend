<table mat-table [dataSource]="capacities" class="mat-elevation-z8">

    <ng-container matColumnDef="hyperBand">
        <th mat-header-cell *matHeaderCellDef> Hyperband</th>
        <td mat-cell *matCellDef="let element"> {{element.acceleration.hyperBand}} </td>
    </ng-container>

    <ng-container matColumnDef="timeToVMax">
        <th mat-header-cell *matHeaderCellDef> TimeToVMax</th>
        <td mat-cell *matCellDef="let element"> {{element.timeToVMax}} </td>
    </ng-container>

    <ng-container matColumnDef="acceleration">
        <th mat-header-cell *matHeaderCellDef> Acceleration</th>
        <td mat-cell *matCellDef="let element"> {{element.acceleration.value}} </td>
    </ng-container>

    <ng-container matColumnDef="velocity">
        <th mat-header-cell *matHeaderCellDef> Velocity</th>
        <td mat-cell *matCellDef="let element"> {{element.velocity.value}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
