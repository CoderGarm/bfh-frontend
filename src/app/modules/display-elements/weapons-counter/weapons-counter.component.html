<mat-accordion *ngIf="!!weapon">
    <mat-expansion-panel class="margin-bottom">
        <mat-expansion-panel-header>
            <app-numeric-counter [disabled]="supportsAlignment('STERN')" [startAt]="getAmountByAlignment('STERN')" [min]="min"
                                 caption='Stern'
                                 [max]="max" (amount)="setAmount('STERN', $event)"></app-numeric-counter>
            <app-numeric-counter [disabled]="supportsAlignment('BROADSIDE')" [startAt]="getAmountByAlignment('BROADSIDE')" [min]="min"
                                 caption='Broadside'
                                 [max]="max" (amount)="setAmount('BROADSIDE', $event)"></app-numeric-counter>
            <app-numeric-counter [disabled]="supportsAlignment('BOW')" [startAt]="getAmountByAlignment('BOW')" [min]="min" [max]="max"
                                 caption='Bow'
                                 (amount)="setAmount('BOW', $event)"></app-numeric-counter>
            <mat-panel-title>
                {{weapon.baseModule.name}}
            </mat-panel-title>
            <mat-panel-description>
                {{weapon.baseModule.description}}
            </mat-panel-description>
        </mat-expansion-panel-header>
        <div class="flex-items-container">
            <mat-form-field appearance="fill" class="short-field">
                <mat-label>Effect value</mat-label>
                <input matInput disabled value="{{weapon.baseModule.effectValue}}">
            </mat-form-field>

            <mat-form-field appearance="fill" class="short-field">
                <mat-label>Tech Level</mat-label>
                <input matInput disabled value="{{weapon.baseModule.techLevel}}">
            </mat-form-field>

            <mat-form-field appearance="fill" class="short-field">
                <mat-label>Capacity usage</mat-label>
                <input matInput disabled value="{{weapon.baseModule.useCapacity}}">
            </mat-form-field>
            <mat-form-field appearance="fill" class="short-field">
                <mat-label>Weapon type</mat-label>
                <input matInput disabled value="{{weapon.weaponType}}">
            </mat-form-field>

            <mat-form-field appearance="fill" class="short-field">
                <mat-label>Effective range</mat-label>
                <input matInput disabled value="{{weapon.effectiveRange}}">
            </mat-form-field>

            <mat-form-field appearance="fill" class="short-field">
                <mat-label>Effective damage</mat-label>
                <input matInput disabled value="{{weapon.baseModule.effectValue}}">
            </mat-form-field>

            <mat-form-field appearance="fill" class="short-field">
                <mat-label>Weapon type</mat-label>
                <input matInput disabled value="{{weapon.weaponType}}">
            </mat-form-field>

            <mat-form-field appearance="fill">
                <mat-label>Alignments</mat-label>
                <input matInput disabled value="{{weapon.alignmentTypes}}">
            </mat-form-field>
        </div>
    </mat-expansion-panel>
</mat-accordion>
