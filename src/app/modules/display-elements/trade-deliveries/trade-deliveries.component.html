<div mat-subheader *ngIf="trades.length == 0">{{ 'journal.trade.nothing' | translate }}</div>
<div mat-subheader *ngIf="trades.length > 0">{{ 'journal.trade.title' | translate }}</div>

<div *ngIf="trades.length > 0">
    <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="tree streamline-background">
        <mat-nested-tree-node *matTreeNodeDef="let node;">
            <div class="mat-tree-node">
                <button mat-icon-button matTreeNodeToggle>
                    <mat-icon class="mat-icon-rtl-mirror">
                        {{treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
                    </mat-icon>
                </button>
                <div mat-subheader *ngIf="!!node.parent.destination">{{ node.parent.destination.name! }}</div>
                <div mat-subheader *ngIf="!!node.parent.origin">{{ node.parent.origin.name! }}</div>
            </div>
            <div [class.tree-invisible]="!treeControl.isExpanded(node)" role="group" class="clearfix">
                <div class="left-side" *ngIf="!!node.parent.tradesByTick.length">
                    <ul>
                        <li *ngFor="let entry of node.parent.tradesByTick" class="delivery-spacer">
                            <div mat-line
                                 *ngIf="!!currentTickService.currentTick && currentTickService.currentTick.tickNo < entry.tick.tickNo">{{ 'journal.trade.expected-arrival' | translate }}
                                {{ entry.tick.tickNo }}</div>
                            <div mat-line
                                 *ngIf="!!currentTickService.currentTick && currentTickService.currentTick.tickNo == entry.tick.tickNo">{{ 'journal.trade.arrival' | translate }}</div>
                            <ul>
                                <li *ngFor="let trade of entry.sales">
                                    <app-trade-display [trade]="trade"></app-trade-display>
                                </li>
                            </ul>
                            <ul>
                                <li *ngFor="let trade of entry.purchases">
                                    <app-trade-display [trade]="trade"></app-trade-display>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </mat-nested-tree-node>
    </mat-tree>
</div>
