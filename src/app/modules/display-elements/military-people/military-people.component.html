<div *ngIf="isDisplayingPossible()">
    <div mat-subheader>{{ 'fleet.display.population.title' | translate }}</div>
    <div class="flex-items-container">
        <div *ngFor="let resource of getDisplayableResources()">
            <img matListItemAvatar class="icon" src="{{getLink(resource)}}" alt="{{resource.resourceType.typeName}}" matTooltip="{{resource.resourceType.typeName}}">
            <app-number-short [input]="getHumans(resource.resourceType, utilization)"></app-number-short>
        </div>
    </div>
</div>
