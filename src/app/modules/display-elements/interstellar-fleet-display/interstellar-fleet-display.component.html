<div *ngFor="let fleet of fleets">
    <app-fleet-display [fleet]="fleet"></app-fleet-display>
    <app-spacecraft-capabilities-display [baseFleetCapabilities]="fleet.baseSpacecraftCapabilities"
                                         [currentFleetCapabilities]="fleet.spacecraftCapabilities"></app-spacecraft-capabilities-display>
    <app-construction-capacity-display [capacities]="fleet.spacecraftCapacityAreas"></app-construction-capacity-display>
</div>
