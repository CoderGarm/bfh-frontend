<div class="flex-items-container">
    <mat-form-field appearance="fill" matBadge="{{weapon?.baseModule?.techLevel | techLevel}}" matBadgePosition="above after">
        <mat-label>Name</mat-label>
        <input matInput disabled value="{{weapon?.baseModule?.name}}">
    </mat-form-field>

    <mat-form-field appearance="fill">
        <mat-label>Description</mat-label>
        <input matInput disabled value="{{weapon?.baseModule?.description}}">
    </mat-form-field>

    <mat-form-field appearance="fill">
        <mat-label>Effect value</mat-label>
        <input matInput disabled value="{{weapon?.baseModule?.effectValue}}">
    </mat-form-field>

    <mat-form-field appearance="fill">
        <mat-label>Capacity usage</mat-label>
        <input matInput disabled value="{{weapon?.baseModule?.useCapacity}}">
    </mat-form-field>

    <mat-form-field appearance="fill">
        <mat-label>Weapon type</mat-label>
        <input matInput disabled value="{{weapon?.weaponType}}">
    </mat-form-field>

    <mat-form-field appearance="fill" *ngIf="!!weapon">
        <mat-label>Effective range</mat-label>
        <input matInput disabled value="{{getRange(weapon) | distance: 'LS' }}">
    </mat-form-field>

    <mat-form-field appearance="fill" *ngIf="!weapon">
        <mat-label>Effective range</mat-label>
        <input matInput disabled>
    </mat-form-field>

    <mat-form-field appearance="fill">
        <mat-label>Alignments</mat-label>
        <input matInput disabled value="{{weapon?.alignmentTypes}}">
    </mat-form-field>

    <mat-form-field appearance="fill">
        <mat-label>Intended for hull type</mat-label>
        <input matInput disabled value="{{weapon?.baseModule?.hullType?.typeName}}">
    </mat-form-field>
</div>
