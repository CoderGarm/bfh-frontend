<mat-card *ngIf="!!fleet && !!fleet.move">
    <mat-card-header>
        <mat-card-title>Move {{fleet!.name}} to {{destinationRepresentation}}</mat-card-title>
        <mat-card-subtitle>{{getTicksLeft()}} of {{fleet!.move!.originalDuration}} ticks</mat-card-subtitle>
    </mat-card-header>
</mat-card>

<mat-card *ngIf="!!fleet && !!fleet.orbit">
    <mat-card-header>
        <mat-card-title>{{fleet!.name}} in orbit of {{orbitRepresentation}}</mat-card-title>
    </mat-card-header>
</mat-card>
