<mat-chip-list>
    <!-- only for using css - don't want to figuring out why its needed here -->
</mat-chip-list>

<mat-grid-list cols="{{maxDepth}}" rowHeight="40px">
    <div class="inner" *ngFor="let idResearches of idResearchesByDepth; let i = index; ">
        <mat-grid-tile *ngFor="let idResearch of idResearches">
            <mat-chip *ngIf="!!getResearch(idResearch)" style="width: 250px;">
                {{getResearch(idResearch)!.name}}
            </mat-chip>
        </mat-grid-tile>
    </div>
</mat-grid-list>
