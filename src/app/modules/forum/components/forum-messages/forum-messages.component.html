<div id="forum-message-list" *ngIf="!!messagesInThread">
    <mat-paginator #paginatorTop
                   class="forum-pager"
                   [length]="messageAmountInThread"
                   [pageIndex]="pageIndex"
                   [pageSize]="pageSize"
                   showFirstLastButtons
                   (page)="fetchByPagination($event)">
    </mat-paginator>
    <mat-card class="forum-card" *ngFor="let message of messagesInThread">
        <mat-card-title>Author: {{message.author}}</mat-card-title>
        <mat-card-subtitle>{{message.sentAt}}</mat-card-subtitle>
        <mat-card-content class="message">
            <div [innerHTML]="message.message"></div>
        </mat-card-content>
        <mat-card-actions *ngIf="message.idAuthor == userID">
            <button mat-button (click)="edit(message)">EDIT</button>
        </mat-card-actions>
    </mat-card>
    <mat-paginator #paginatorBottom
                   class="forum-pager"
                   [length]="messageAmountInThread"
                   [pageIndex]="pageIndex"
                   [pageSize]="pageSize"
                   showFirstLastButtons
                   (page)="fetchByPagination($event)">
    </mat-paginator>
</div>

<mat-card class="forum-message-card" *ngIf="!!messagesInThread">
    <mat-card-content>
        <form [formGroup]=messageFG>
            <angular-editor
                    id="forum-message-form-field"
                    formControlName="messageFC"
                    [config]="editorConfig"></angular-editor>
        </form>
        <button mat-raised-button color="secondary" type="submit" (click)="submitMessage()"
                [disabled]="!this.messageFG.controls.messageFC.value" id="send-forum-message-button">Submit
        </button>
    </mat-card-content>
</mat-card>
