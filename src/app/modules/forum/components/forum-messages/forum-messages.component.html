<div id="forum-message-list" *ngIf="!!messagesInThread">
    <mat-paginator #paginatorTop
                   class="forum-pager"
                   [length]="messageAmountInThread"
                   [pageIndex]="pageIndex"
                   [pageSize]="pageSize"
                   showFirstLastButtons
                   (page)="fetchByPagination($event)">
    </mat-paginator>
    <mat-card appearance="outlined" class="forum-card" *ngFor="let message of messagesInThread">
        <mat-card-title>Author: {{message.author}}</mat-card-title>
        <mat-card-subtitle>{{message.sentAt | date: 'dd.MM.yyyy HH:mm'}}</mat-card-subtitle>
        <mat-card-content class="message">
            <markdown [data]="message.message"></markdown>
        </mat-card-content>
        <mat-card-actions *ngIf="message.idAuthor == userId">
            <button mat-button (click)="msgToEdit = message">EDIT</button>
        </mat-card-actions>
    </mat-card>
    <mat-paginator #paginatorBottom
                   class="forum-pager"
                   [length]="messageAmountInThread"
                   [pageIndex]="pageIndex"
                   [pageSize]="pageSize"
                   showFirstLastButtons
                   (page)="fetchByPagination($event)">
    </mat-paginator>
</div>

<mat-card appearance="outlined" class="forum-message-card" *ngIf="!!messagesInThread">
    <mat-card-content>
        <app-markdown-editor textareaId="chat-message-form-field"
                             [rows]="10"
                             [editableText]="msgToEdit?.message"
                             (play)="submitMessage($event)"></app-markdown-editor>
    </mat-card-content>
</mat-card>
