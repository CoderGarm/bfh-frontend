<div class="header"
     cdkDrag
     cdkDragRootElement=".confirm-mat-dialog-panel"
     cdkDragBoundary=".cdk-overlay-container">
    <h1 mat-dialog-title>New thread in {{ forumsNotificationService.selectedForum?.title }}</h1>
</div>
<div mat-dialog-content>
    <form [formGroup]=newThreadFG>
        <div id="new-thread-field">
            <mat-form-field appearance="outline" id="thread-title" class="title-field">
                <mat-label>New thread's title</mat-label>
                <input matInput formControlName=newThreadsTitle placeholder="New thread's title" autocomplete="off" required>
            </mat-form-field>
            <mat-form-field appearance="outline" id="thread-description" class="description-field">
                <mat-label>New thread's description</mat-label>
                <input matInput formControlName=newThreadsDescription placeholder="New thread's description" autocomplete="off">
            </mat-form-field>
            <angular-markdown-editor
                    textareaId="new-forum-thread-message"
                    [rows]="15"
                    formControlName="firstMessage"
                    [options]="editorOptions"
                    class="angular-markdown-editor-minimalistic">
            </angular-markdown-editor>
        </div>
    </form>
</div>
<div mat-dialog-actions class="dialog-actions">
    <button mat-raised-button color="secondary" (click)="confirm()" [disabled]="newThreadFG.invalid" cdkFocusInitial>{{ 'action.submit' | translate }}</button>
    <button mat-raised-button color="secondary" (click)="cancel()">{{ 'action.clear' | translate }}</button>
</div>
