<div id="new-thread-field">
    <form [formGroup]=newThreadFG>
        <mat-form-field appearance="fill" id="thread-title" class="description-field">
            <mat-label>New thread's title</mat-label>
            <input matInput formControlName=newThreadsTitle placeholder="New thread's title" autocomplete="off" required>
        </mat-form-field>
        <mat-form-field appearance="fill" id="thread-description" class="description-field">
            <mat-label>New thread's description</mat-label>
            <input matInput formControlName=newThreadsDescription placeholder="New thread's description" autocomplete="off">
        </mat-form-field>
        <mat-form-field appearance="fill" id="thread-message" class="description-field">
            <mat-label>First message</mat-label>
            <textarea id="message-text" matInput formControlName=firstMessage placeholder="The message" autocomplete="off" required></textarea>
        </mat-form-field>
    </form>
</div>
