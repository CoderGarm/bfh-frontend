<div class="container">

<mat-form-field class="full-width mar-ri container" appearance="outline" *ngIf="!!article">
    <mat-label>{{ 'wiki.article.display.author' | translate }} / {{ 'wiki.article.display.revision' | translate }}</mat-label>
    <input matInput type='text' value="{{ authorName }} / {{ revision }}" disabled autocomplete="off">
</mat-form-field>
