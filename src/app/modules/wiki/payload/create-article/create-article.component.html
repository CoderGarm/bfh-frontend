<div class="container">
    <mat-form-field class="full-width mar-ri" appearance="outline">
        <mat-label>{{ 'wiki.article.create.title' | translate }}</mat-label>
        <input matInput type='text' [value]="title" disabled required autocomplete="off"> <!-- fixme make nicer look and selection -->
    </mat-form-field>
    <mat-select [(value)]="langCode" class="mar-ri small">
        <mat-option *ngFor="let lang of possibleLanguages" [value]="lang">
            {{lang}}
        </mat-option>
    </mat-select>
    <mat-select [(value)]="type" class="mar-ri small">
        <mat-option *ngFor="let lang of possibleTypes" [value]="lang">
            {{lang}}
        </mat-option>
    </mat-select>
    <button mat-raised-button class="mar-ri" color="primary" type="submit" (click)="submit()" [disabled]="canSend()">{{ 'wiki.article.create.button' | translate }}</button>
</div>
<div class="container">
    <angular-markdown-editor
            textareaId="editor2"
            [rows]="15"
            name="markdownText"
            [(ngModel)]="markdownText"
            [options]="editorOptions"
            class="angular-markdown-editor-minimalistic">
    </angular-markdown-editor>
</div>
<div class="container">
    <markdown lineNumbers [data]="markdownText"></markdown>
</div>
