<div class="content-area">
    <app-chip-selector multiple noCheckmark preSelect style="width: 90%;"
                       titleValue="Filter modules by ship class"
                       [chipValues]="eHullTypeChipValues"
                       (chipValuesChange)="filterDisplayedItems($event)"></app-chip-selector>

    <mat-tab-group animationDuration="500ms" class="bottom-spacer">
        <mat-tab label="{{ 'library.modules.title.armor' | translate }}">
            <div class="flex-items-container content-area">
                <app-base-module-display *ngFor="let module of filteredArmors"
                                         showIcon [module]="module"></app-base-module-display>
            </div>
        </mat-tab>
        <mat-tab label="{{ 'library.modules.title.weapon' | translate }}">
            <ng-template matTabContent>
                <div class="flex-items-container content-area">
                    <app-base-module-display *ngFor="let module of filteredWeapons"
                                             showIcon [module]="module"></app-base-module-display>
                </div>
            </ng-template>
        </mat-tab>
        <mat-tab label="{{ 'library.modules.title.launcher' | translate }}">
            <ng-template matTabContent>
                <div class="flex-items-container content-area">
                    <app-base-module-display *ngFor="let module of filteredLaunchers"
                                             showIcon [module]="module"></app-base-module-display>
                </div>
            </ng-template>
        </mat-tab>
        <mat-tab label="{{ 'library.modules.title.sidewall' | translate }}">
            <ng-template matTabContent>
                <div class="flex-items-container content-area">
                    <app-base-module-display *ngFor="let module of filteredSidewalls"
                                             showIcon [module]="module"></app-base-module-display>
                </div>
            </ng-template>
        </mat-tab>
        <mat-tab label="{{ 'library.modules.title.eloka' | translate }}">
            <ng-template matTabContent>
                <div class="flex-items-container content-area">
                    <app-base-module-display *ngFor="let module of filteredEloka"
                                             showIcon [module]="module"></app-base-module-display>
                </div>
            </ng-template>
        </mat-tab>
        <mat-tab label="{{ 'library.modules.title.passiveModule' | translate }}">
            <ng-template matTabContent>
                <div class="flex-items-container content-area">
                    <app-base-module-display *ngFor="let module of filteredPassiveModules"
                                             [module]="module"></app-base-module-display>
                </div>
            </ng-template>
        </mat-tab>
        <mat-tab label="{{ 'library.modules.title.propulsion' | translate }}">
            <ng-template matTabContent>
                <div class="content-area">

                    <div class="flex-items-container">
                        <mat-button-toggle-group>
                            <mat-button-toggle *ngFor="let type of technologyTypes" (click)="selectTechnologyType(type)" [checked]="type === selectedTechnologyType">
                                <div class="capitalize">{{ type }}</div>
                            </mat-button-toggle>
                        </mat-button-toggle-group>

                        <mat-button-toggle-group>
                            <mat-button-toggle *ngFor="let type of hyperBands" (click)="selectHyperband(type)" [checked]="type === selectedHyperband">
                                <div class="capitalize">{{ type }}</div>
                            </mat-button-toggle>
                        </mat-button-toggle-group>
                    </div>

                    <div class="flex-items-container" style="margin-top: 25px;">
                        <app-propulsion-module-display *ngFor="let propulsion of filteredPropulsions"
                                                       showIcon class="width-fit-content"
                                                       [module]="propulsion"></app-propulsion-module-display>
                    </div>
                </div>
            </ng-template>
        </mat-tab>
    </mat-tab-group>
</div>
