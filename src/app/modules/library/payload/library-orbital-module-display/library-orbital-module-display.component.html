<div class="content-area">
    <app-chip-selector multiple noCheckmark preSelect style="width: 90%;"
                       titleValue="Filter by effect"
                       [chipValues]="moduleChipValues" (chipValuesChange)="moduleResultingChips = $event; filterDisplayedItems()"></app-chip-selector>

    <app-chip-selector multiple noCheckmark preSelect style="width: 90%;"
                       titleValue="Filter by resource"
                       [chipValues]="resourceChipValues" (chipValuesChange)="resourceResultingChips = $event; filterDisplayedItems()"></app-chip-selector>

    <mat-divider></mat-divider>

    <div class="flex-items-container">
        <app-orbital-module-display libraryMode resourceMode showIcon *ngFor="let module of filteredOrbitalModules"
                                    [module]="module"></app-orbital-module-display>
    </div>
</div>
