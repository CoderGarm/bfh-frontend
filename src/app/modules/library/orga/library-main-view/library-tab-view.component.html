<mat-tab-group animationDuration="500ms" class="bottom-spacer">
    <mat-tab label="{{ 'tab.library.module' | translate }}">
        <ng-template matTabContent>
            <app-library-module-display></app-library-module-display>
        </ng-template>
    </mat-tab>
    <mat-tab label="{{ 'tab.library.buildings' | translate }}">
        <ng-template matTabContent>
            <app-library-building-display></app-library-building-display>
        </ng-template>
    </mat-tab>
    <mat-tab label="{{ 'tab.library.orbital-modules' | translate }}">
        <ng-template matTabContent>
            <app-library-orbital-module-display></app-library-orbital-module-display>
        </ng-template>
    </mat-tab>
    <mat-tab label="{{ 'tab.library.tech-tree' | translate }}">
        <ng-template matTabContent>
            <app-tech-tree></app-tech-tree>
        </ng-template>
    </mat-tab>
</mat-tab-group>
