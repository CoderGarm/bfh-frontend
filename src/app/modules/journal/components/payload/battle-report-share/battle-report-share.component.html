<div class="outer streamline-background">

    <div>
        <mat-checkbox (change)="setEveryone($event)" [checked]="!!shared ? shared.shareWithEveryone : false">
            {{ 'combat-arena.battle-reports.share-dialog.for-everyone' | translate }}
        </mat-checkbox>
    </div>

    <div class="flex-items-from-start-container">

        <div class="red-box">
            <div class="red-box-title">
                {{ 'combat-arena.battle-reports.share-dialog.select-alliance' | translate }}
            </div>
            <div class="red-box-content">
                <mat-selection-list>
                    <mat-list-option *ngFor="let alliance of alliances" [selected]="isAllianceShared(alliance)"
                                     [value]="alliance" #item (click)="setAlliance(item, alliance)">

                        <span matListItemTitle>{{ alliance.name }}</span>
                        <span matListItemLine>[{{ alliance.code }}]</span>

                    </mat-list-option>
                </mat-selection-list>
            </div>
        </div>

        <div class="red-box">
            <div class="red-box-title">
                {{ 'combat-arena.battle-reports.share-dialog.select-user' | translate }}
            </div>
            <div class="red-box-content">
                <mat-selection-list>
                    <mat-list-option *ngFor="let user of users" [selected]="isUserShared(user)"
                                     [value]="user" #item (click)="setUser(item, user)">

                        <span matListItemTitle>{{ user.username }}</span>

                    </mat-list-option>
                </mat-selection-list>
            </div>
        </div>

    </div>
</div>
