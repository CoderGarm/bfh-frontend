<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

    <ng-container matColumnDef="planet">
        <th mat-header-cell *matHeaderCellDef [attr.rowspan]="2"> Planet</th>
        <td mat-cell *matCellDef="let element"> {{element.position}} </td>
    </ng-container>

    <ng-container matColumnDef="ground">
        <th mat-header-cell *matHeaderCellDef>{{ 'planetary.constructions.title' | translate }}</th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

    <ng-container matColumnDef="shipyard">
        <th mat-header-cell *matHeaderCellDef>{{ 'shipyard.constructions.title' | translate }}</th>
        <td mat-cell *matCellDef="let element"> {{element.weight}} </td>
    </ng-container>

    <ng-container matColumnDef="research">
        <th mat-header-cell *matHeaderCellDef [attr.rowspan]="2">{{ 'research.title' | translate }}</th>
        <td mat-cell *matCellDef="let element"> {{element.symbol}} </td>
    </ng-container>

    <ng-container matColumnDef="jobs">
        <th mat-header-cell *matHeaderCellDef [attr.colspan]="2">{{ 'journal.commissioned-operationals.title.constructions' | translate }}</th>
        <!-- This column doesn't generate <td> items, so no need to add a definition for them -->
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['planet', 'jobs', 'research']"></tr>
    <tr mat-header-row *matHeaderRowDef="['ground', 'shipyard']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['planet', 'ground', 'shipyard', 'research']"></tr>
</table>
<mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" [pageSize]="10" aria-label="Select page of planets"></mat-paginator>
