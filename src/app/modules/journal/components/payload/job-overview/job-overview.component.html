<mat-card id="research-block" class="blue-card">
    {{ 'research.title' | translate }}
    <div class="research-container">
        <app-icon png64px research class="research-icon"></app-icon>
        <app-job-display [job]="runningResearch"></app-job-display>
        <app-job-display *ngIf="!!finishedResearch" [job]="finishedResearch"></app-job-display>
    </div>
</mat-card>


<table mat-table [dataSource]="dataSource">

    <ng-container matColumnDef="planet">
        <th mat-header-cell *matHeaderCellDef [attr.rowspan]="2">
            <app-icon png64px planet></app-icon>
        </th>
        <td mat-cell *matCellDef="let element">
            <span class="name-field">{{ element.planetName }}</span>
        </td>
    </ng-container>

    <ng-container matColumnDef="ground">
        <th mat-header-cell *matHeaderCellDef>
            <app-icon png32px construction></app-icon>
        </th>
        <td mat-cell *matCellDef="let element">
            <div class="job-container">
                <app-job-display noIcon *ngIf="!element.construction"></app-job-display>
                <app-job-display noIcon *ngIf="!!element.construction" [job]="element.construction"></app-job-display>
                <app-job-display noIcon *ngIf="!!element.finishedConstruction" [job]="element.finishedConstruction"></app-job-display>
            </div>
        </td>
    </ng-container>

    <ng-container matColumnDef="shipyard">
        <th mat-header-cell *matHeaderCellDef>
            <app-icon png32px shipyard></app-icon>
        </th>
        <td mat-cell *matCellDef="let element">
            <div class="job-container">
                <app-job-display noIcon *ngFor="let j of element.shipyard" [job]="j"></app-job-display>
                <app-job-display noIcon *ngIf="!!element.finishedShipyard" [job]="element.finishedShipyard"></app-job-display>
            </div>
        </td>
    </ng-container>

    <ng-container matColumnDef="jobs">
        <th mat-header-cell *matHeaderCellDef [attr.colspan]="2">{{ 'jobs.title.only-job-title' | translate }}</th>
        <!-- This column doesn't generate <td> items, so no need to add a definition for them -->
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['planet', 'jobs']"></tr>
    <tr mat-header-row *matHeaderRowDef="['ground', 'shipyard']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['planet', 'ground', 'shipyard']"></tr>
</table>
