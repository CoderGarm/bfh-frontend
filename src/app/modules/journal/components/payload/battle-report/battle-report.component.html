<app-combat-arena *ngIf="!!battleRegisterService.currentlyOpenedItem && !!battleRegisterService.combatArenaData && battleRegisterService.combatArenaData.combatRounds.length > 0"
                  [starSystem]="battleRegisterService.starSystem"
                  [battleReport]="battleRegisterService.currentlyOpenedItem"
                  [combatArenaData]="battleRegisterService.combatArenaData"
                  [activeRound]="battleRegisterService.activeRound"></app-combat-arena>

<div class="player-control transparent-backdrop"
     *ngIf="!!battleRegisterService.currentlyOpenedItem && !!battleRegisterService.combatArenaData && battleRegisterService.combatArenaData.combatRounds.length > 0">

    <div echarts [options]="options" class="action-chart"></div>

    <mat-slider id="battle-round-stepper"
                discrete
                [displayWith]="formatLabel"
                step="1"
                min="1"
                [max]="getLastRound()"
                aria-label="units">
        <input matSliderThumb (valueChange)="slide($event)" [value]="battleRegisterService.activeRound">
    </mat-slider>


    <button mat-icon-button class="battle-register-btn" (click)="battleRegisterService.openRegister()"
            matTooltip="{{ 'combat-arena.battle-register.title' | translate }}">
        <img mat-card-avatar src="assets/icons/misc/database.svg" alt="battle register button">
    </button>

    <div class="center">
        <mat-button-toggle-group>
            <mat-button-toggle (click)="stop()" matTooltip="jump to start">
                <mat-icon>fast_rewind</mat-icon>
            </mat-button-toggle>
            <mat-button-toggle (click)="previous()" matTooltip="previous combat round">
                <mat-icon>navigate_before</mat-icon>
            </mat-button-toggle>
            <mat-button-toggle (click)="pause()" matTooltip="pause">
                <mat-icon>pause</mat-icon>
            </mat-button-toggle>
            <mat-button-toggle (click)="play()" matTooltip="play">
                <mat-icon>play_arrow</mat-icon>
            </mat-button-toggle>
            <mat-button-toggle (click)="next()" matTooltip="next combat round">
                <mat-icon>navigate_next</mat-icon>
            </mat-button-toggle>
            <mat-button-toggle (click)="fastForward()" matTooltip="jump to end">
                <mat-icon>fast_forward</mat-icon>
            </mat-button-toggle>
        </mat-button-toggle-group>
    </div>
</div>
