<mat-accordion>
    <mat-expansion-panel *ngFor="let fleet of movingFleets" class="margin-bottom item">
        <mat-expansion-panel-header>{{fleet.name}}</mat-expansion-panel-header>
        <app-fleet-display [fleet]="fleet">
            <app-spacecraft-capabilities-display body
                                                 [baseFleetCapabilities]="fleet.baseSpacecraftCapabilities"
                                                 [currentFleetCapabilities]="fleet.spacecraftCapabilities"></app-spacecraft-capabilities-display>
            <app-ship-class-tonnage-per-section-display body [capacities]="fleet.spacecraftCapacityAreas"></app-ship-class-tonnage-per-section-display>
            <app-fleet-move-display body [fleet]="fleet" [showTitle]="false"></app-fleet-move-display>
        </app-fleet-display>
    </mat-expansion-panel>
</mat-accordion>
