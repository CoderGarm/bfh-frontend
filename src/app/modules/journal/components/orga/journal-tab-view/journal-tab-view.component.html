<mat-tab-group animationDuration="0ms" class="bottom-spacer">
    <mat-tab label="{{ 'tab.journal.dashboard' | translate }}">
        <ng-template matTabContent>
            <app-journal-dashboard></app-journal-dashboard>
        </ng-template>
    </mat-tab>
    <mat-tab>
        <ng-template mat-tab-label>
            {{ 'tab.journal.battles' | translate }}
            <mat-icon *ngIf="hasNewReports" [inline]="true">mark_email_unread</mat-icon>
        </ng-template>
        <ng-template matTabContent>
            <app-battle-report></app-battle-report>
        </ng-template>
    </mat-tab>
    <mat-tab label="{{ 'tab.journal.movements' | translate }}">
        <ng-template matTabContent>
            <app-fleet-movement-journal></app-fleet-movement-journal>
        </ng-template>
    </mat-tab>
    <mat-tab label="{{ 'tab.journal.jobs' | translate }}">
        <ng-template matTabContent>
            <app-job-journal></app-job-journal>
        </ng-template>
    </mat-tab>
</mat-tab-group>
