<div class="fitting">
    <mat-form-field appearance="outline" class="name-box">
        <mat-label>Ship class</mat-label>
        <input matInput disabled value="{{shipClassName}}" autocomplete="off">
    </mat-form-field>
    <app-ship-class-svg [isTemplateRenderedInput]="isSelectedOutput" [svgSelector]="svgSelector"
                        [selectedShipClassInput]="shipClass"></app-ship-class-svg>

    <app-resource-display [deposit]="resourceDeposit"
                          [costs]="costs"></app-resource-display>

    <div class="middle">
        <app-spacecraft-capabilities-display [baseFleetCapabilities]="shipClass?.shipClassCapabilities"></app-spacecraft-capabilities-display>
        <app-construction-capacity-display [capacities]="shipClass?.spacecraftCapacityAreas"></app-construction-capacity-display>
        <app-weapon-amount-by-alignment-display [shipClass]="shipClass"></app-weapon-amount-by-alignment-display>
    </div>

    <app-ship-class-display *ngIf="!!shipClass" [shipClassInput]="shipClass"></app-ship-class-display>
</div>
