<mat-tab-group (selectedTabChange)="emitTabSelectedIndex($event)" animationDuration="500ms" class="bottom-spacer">
    <mat-tab label="{{ 'tab.shipyard.fitting.view' | translate }}">
        <ng-template matTabContent>
            <app-fitting-display [selectedIndexInput]="selectionEmitter"
                                 [resourceDeposit]="resourceDeposit"></app-fitting-display>
        </ng-template>
    </mat-tab>
    <mat-tab label="{{ 'tab.shipyard.fitting.modify' | translate }}">
        <ng-template matTabContent>
            <app-fitting-modify [selectedIndexInput]="selectionEmitter"
                                [resourceDeposit]="resourceDeposit"></app-fitting-modify>
        </ng-template>
    </mat-tab>
</mat-tab-group>
