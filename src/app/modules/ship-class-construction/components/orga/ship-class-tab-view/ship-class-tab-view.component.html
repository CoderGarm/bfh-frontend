<mat-tab-group (selectedTabChange)="emitTabSelectedIndex($event)" animationDuration="0ms" class="bottom-spacer">
    <mat-tab label="{{'tab.shipyard.fitting.view' | translate}}" [disabled]="!selectedShipClassInput">
        <app-fitting-display [selectedIndexInput]="selectionEmitter"
                             [resourceDeposit]="resourceDeposit"
                             [shipClass]="selectedShipClassInput"></app-fitting-display>
    </mat-tab>
    <mat-tab label="{{'tab.shipyard.fitting.modify' | translate}}">
        <app-fitting-selection [selectedIndexInput]="selectionEmitter"
                               [resourceDeposit]="resourceDeposit"
                               (modifiedShipClassOutput)="passOutput($event)"
                               [shipClass]="selectedShipClassInput"></app-fitting-selection>
    </mat-tab>
</mat-tab-group>
