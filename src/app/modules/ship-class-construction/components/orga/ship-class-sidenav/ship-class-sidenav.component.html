<mat-sidenav-container class="drawer-container">
    <mat-sidenav mode="side" class="drawer-list" [opened]="sideNavOpen">
        <app-ship-class-selection (selectedShipClassOutput)="selectedShipClassInput = $event"
                                  [modifiedShipClassInput]="modifiedShipClassInput"></app-ship-class-selection>
    </mat-sidenav>
    <mat-sidenav-content>
        <div class="side-nav-open-change-area" (mouseenter)="onSideNavToggle()" (mouseout)="onSideNavToggle()"></div>
        <app-ship-class-tab-view [selectedShipClassInput]="selectedShipClassInput"
                                 (modifiedShipClassOutput)="modifiedShipClassInput = $event"></app-ship-class-tab-view>
    </mat-sidenav-content>
</mat-sidenav-container>
