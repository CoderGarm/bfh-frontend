<div class="content-area">


    <div id="map-box">
        <mat-chip-listbox #chipList multiple id="mission-chips">
            <mat-chip-option selected
                             *ngFor="let mission of missionCommService.missionTypes"
                             (selectionChange)="missionTypeChange()"
                             [ngStyle]="{'background-color' :getColor(mission)}">
                {{ mission }}
            </mat-chip-option>
        </mat-chip-listbox>
        <mission-map
                [highlight]="colorGroups"
                [colonized]="colonized"
                [highlightedCenter]="centerCoord"></mission-map>
        <div class="legend-box">
            <span>{{ 'mission.legend.title' | translate }}</span>
            <ul>
                <li id="legend-highlighted">{{ 'mission.legend.highlighted' | translate }}</li>
                <li id="legend-colonized">{{ 'mission.legend.colonized-systems' | translate }}</li>
                <li id="legend-multi-mission">{{ 'mission.legend.multi-mission' | translate }}</li>
                <li id="legend-no-mission">{{ 'mission.legend.no-mission' | translate }}</li>
            </ul>
        </div>
    </div>
</div>
