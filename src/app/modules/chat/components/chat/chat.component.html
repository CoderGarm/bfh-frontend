<mat-drawer-container class="drawer-container">
  <mat-drawer mode="side" opened="true" class="drawer-list">
    <app-chat-selection-list (selectedUserChatListOutput)="selectedUserChatInput = $event"
                             [newChatStartedChatListInput]="newChatStartedChatInput"></app-chat-selection-list>
  </mat-drawer>
  <mat-drawer-content class="no-scrolling">
    <app-chat-history [selectedUserChatHistoryInput]="selectedUserChatInput"
                      (newChatStartedChatHistoryOutput)="newChatStartedChatInput = $event"></app-chat-history>
  </mat-drawer-content>
</mat-drawer-container>
