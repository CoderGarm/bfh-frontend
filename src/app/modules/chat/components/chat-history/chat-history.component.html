<mat-card *ngFor="let message of chatHistory?.messages" [className]="chooseStyleFromSender(message.sender)">
  <mat-card-header>
    <div mat-card-avatar class="avatar-image"></div>
    <mat-card-title>{{message.sender.username}}</mat-card-title>
    <mat-card-subtitle>{{message.sentAt | date:'medium'}}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <p class="message">{{message.message}}</p>
  </mat-card-content>
</mat-card>

<mat-card [className]="chooseStyleByChat()">
  <mat-card-content>
    <form [formGroup]=chatFG>
      <mat-form-field appearance="fill" id="chat-message-form-field">
        <mat-label>Message</mat-label>
        <textarea matInput autocomplete="off" placeholder="Message ..." formControlName=messageFC
                  (keyup.enter)="submitMessage()"></textarea>
      </mat-form-field>
    </form>
    <button mat-raised-button color="secondary" type="submit" (click)="submitMessage()"
            [disabled]="!this.chatFG.controls.messageFC.value" id="send-chat-message-button">Submit
    </button>
  </mat-card-content>
</mat-card>
