<div id="arrow-container">
    <div class="arrow">
        <mat-icon *ngIf="displayPreviousMessageArrow()" (click)="maxUp()">keyboard_double_arrow_up</mat-icon>
    </div>
    <div id="message-container">
        <mat-card appearance="outlined" #chatCardList *ngFor="let message of messages" [className]="chooseStyleFromSender(message)">
            <mat-card-header>
                <img mat-card-avatar class="avatar-image" src="assets/icons/user/{{ message.sender.profilePic }}.png">
                <mat-card-title>
                    {{message.sender.username}}
                    <app-icon *ngIf="!message.receivedAt && message.sender.idUser != userId" hasUnread></app-icon>
                </mat-card-title>
                <mat-card-subtitle>{{message.sentAt  | date: 'dd.MM.yyyy HH:mm'}}</mat-card-subtitle>
            </mat-card-header>
            <mat-card-content>
                <markdown [data]="message.message"></markdown>
            </mat-card-content>
            <mat-card-footer class="completely-hidden" [lang]="message.idUserMessage">If you see that, you are a hacker.</mat-card-footer>
        </mat-card>
    </div>
    <div class="arrow">
        <mat-icon *ngIf="displayNextMessageArrow()" (click)="maxDown()">keyboard_double_arrow_down</mat-icon>
    </div>
</div>

<mat-card appearance="outlined" class="chat-card set-right write-card message-field-in-flow" *ngIf="!!chatHistory">
    <mat-card-content>
        <mat-icon *ngIf="isNewChat">new_releases</mat-icon>
        <app-markdown-editor textareaId="chat-message-form-field"
                             [rows]="8"
                             (play)="submitMessage($event)"></app-markdown-editor>
    </mat-card-content>
</mat-card>
