<div id="arrow-container">
    <div class="arrow">
        <mat-icon *ngIf="displayPreviousMessageArrow()" (click)="maxUp()">keyboard_double_arrow_up</mat-icon>
    </div>
    <div id="message-container">
        <mat-card #chatCardList *ngFor="let message of messages" [className]="chooseStyleFromSender(message)">
            <mat-card-header>
                <div mat-card-avatar class="avatar-image"></div>
                <mat-card-title>
                    {{message.sender.username}}
                    <mat-icon *ngIf="!message.receivedAt && message.sender.idUser != myUserID">mark_email_unread</mat-icon>
                </mat-card-title>
                <mat-card-subtitle>{{message.sentAt | date:'medium'}}</mat-card-subtitle>
            </mat-card-header>
            <mat-card-content>
                <div class="message" [innerHTML]="message.message"></div>
            </mat-card-content>
            <mat-card-footer class="completely-hidden" [lang]="message.idUserMessage">If you see that, you are a hacker.</mat-card-footer>
        </mat-card>
    </div>
    <div class="arrow">
        <mat-icon *ngIf="displayNextMessageArrow()" (click)="maxDown()">keyboard_double_arrow_down</mat-icon>
    </div>
</div>

<mat-card class="chat-card set-right write-card message-field-in-flow">
    <mat-card-content>
        <mat-icon *ngIf="isNewChat">new_releases</mat-icon>
        <form [formGroup]=chatFG>
            <angular-editor
                    id="chat-message-form-field"
                    formControlName="messageFC"
                    [config]="editorConfig"></angular-editor>
        </form>
        <button mat-raised-button color="secondary" type="submit" (click)="submitMessage()"
                [disabled]="!this.chatFG.controls.messageFC.value" id="send-chat-message-button">Submit
        </button>
    </mat-card-content>
</mat-card>
