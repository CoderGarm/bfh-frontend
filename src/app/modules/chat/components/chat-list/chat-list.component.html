<form [formGroup]=userSearchFromGroup>
    <mat-form-field appearance="fill">
        <mat-label>Search user</mat-label>
        <input matInput autocomplete="off" placeholder="Username ..." formControlName=searchUserNameFC>
    </mat-form-field>
</form>

<mat-selection-list [multiple]="false">
    <mat-list-option *ngFor="let user of foundPossibleChatPartners" (click)="displayChatHistoryBetweenMeAnd(user)">
        {{user.username}}
    </mat-list-option>
</mat-selection-list>

<br>
{{ 'chats.title' | translate }}

<mat-selection-list [multiple]="false">
    <mat-list-option *ngFor="let chat of activeChats" (click)="displayChatHistoryBetweenMeAnd(getChatPartner(chat))">
        <mat-icon *ngIf="hasUnread(chat)">mark_email_unread</mat-icon>
        {{getChatPartner(chat).username}}
    </mat-list-option>
</mat-selection-list>
