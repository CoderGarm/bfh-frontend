<div *ngIf="!!resourceType">
    <img class="icon"
         src="{{getLink(resourceType)}}"
         alt="{{resourceType.typeName}}"
         matTooltip="{{resourceType.typeName}}">
    <app-numeric-counter [inputDisabled]="false"
                         ngClass="big"
                         [startAt]="startAt"
                         [min]="min"
                         [max]="max"
                         [caption]="caption"
                         [disabled]="disabled"
                         (amount)="setAmount($event)"></app-numeric-counter>
</div>
