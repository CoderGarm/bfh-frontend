<app-nav></app-nav>
<mat-drawer-container id="main-drawer">
    <mat-drawer mode="side" #drawer [opened]="isLoggedIn" id="nav-drawer">
        <mat-selection-list [multiple]="false" hideSingleSelectionIndicator>
            <mat-list-option *ngFor="let route of routes" (click)="navigate(route)" [selected]="route.path == afterLoginPath">
                {{ 'path.menu.' + route.path | translate }}
                <mat-icon *ngIf="hasUnread(route.path!)">mark_email_unread</mat-icon>
            </mat-list-option>
        </mat-selection-list>
    </mat-drawer>
    <mat-drawer-content [ngClass]="{'no-scrolling' : !!isNoScroll}">
        <app-global-spinner></app-global-spinner>
        <router-outlet></router-outlet>
        <app-home *ngIf="displayWelcome()"></app-home>
    </mat-drawer-content>
</mat-drawer-container>
<button id="toggle-nav" type="button" mat-button (click)="drawer.toggle()" *ngIf="isLoggedIn">
    <mat-icon *ngIf="drawer.opened">switch_right</mat-icon>
    <mat-icon *ngIf="!drawer.opened">switch_left</mat-icon>
</button>
