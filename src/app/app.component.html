<app-nav></app-nav>
<mat-drawer-container id="main-drawer" autosize>
    <mat-drawer mode="side" #drawer [opened]="isLoggedIn" id="nav-drawer">
        <app-nested-sidenav [routes]="routes"
                            [hasUnread]="hasUnread"
                            [isLoggedIn]="isLoggedIn"
                            [afterLoginPath]="afterLoginPath"></app-nested-sidenav>
    </mat-drawer>
    <mat-drawer-content [ngStyle]="{'overflow':( isNoScroll ? 'hidden' : 'auto')}" id="main-content-area">
        <router-outlet></router-outlet>
        <button mat-icon-button class="tutorial-btn"
                *ngIf="isLoggedIn && tutorialScope.hasTutorial"
                (click)="openBottomSheet()"
                matTooltip="{{ 'tutorial.trigger.scope-selector' | translate }}">
            <img mat-card-avatar class="avatar-image" src="assets/icons/misc/uncertainty.png" alt="tutorial icon">
        </button>
        <app-home *ngIf="displayWelcome()"></app-home>
    </mat-drawer-content>
</mat-drawer-container>
<button id="toggle-nav" type="button" mat-button (click)="drawer.toggle()" *ngIf="isLoggedIn">
    <mat-icon *ngIf="drawer.opened">switch_right</mat-icon>
    <mat-icon *ngIf="!drawer.opened">switch_left</mat-icon>
</button>
<ngx-spinner type="ball-clip-rotate-multiple" color="#375a7f" name="misc-spinner">{{ message }}</ngx-spinner>
<ngx-spinner type="ball-clip-rotate-multiple" color="#375a7f" name="universe-map">{{ 'star-map.universe-map.loading-spinner-message' | translate }}</ngx-spinner>
<ngx-spinner type="ball-clip-rotate-multiple" color="#375a7f" name="mission-map">{{ 'mission.spinner.wait-to-load' | translate }}</ngx-spinner>
<ngx-spinner color="#375a7f" name="screen-size">
    <app-screen-size-warning></app-screen-size-warning>
</ngx-spinner>

<ngx-spinner type="ball-clip-rotate-multiple" color="#375a7f" name="advisory-spinner">
    <img src="{{ imageLink }}" alt="loading image" class="spinner-img">
    <div class="la-3x la-ball-clip-rotate-multiple bottom-right" style="color: rgb(55, 90, 127);">
        <div class="ng-star-inserted"></div>
        <div class="ng-star-inserted"></div>
    </div>
</ngx-spinner>
